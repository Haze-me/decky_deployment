apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: solver-auth
  namespace: solver
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - auth.emchrismobility.com
      secretName: solver-auth-tls
  rules:
    - host: auth.emchrismobility.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: solver-auth
                port:
                  number: 80
